<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:18px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 8px;color:#3157d5;font-size:12px;font-weight:700;letter-spacing:1px">KAD CONCURSOS</p>
                <h1 style="margin:0 0 12px;font-size:25px;line-height:1.25">Confirme seu e-mail</h1>
                <p style="margin:0 0 24px;color:#596276;font-size:15px;line-height:1.6">
                  Digite este código no aplicativo para concluir seu cadastro:
                </p>
                <div style="margin:0 0 24px;padding:18px;border-radius:12px;background:#eef2ff;color:#203f9d;font-size:32px;font-weight:700;letter-spacing:10px;text-align:center">
                  {{ .Token }}
                </div>
                <p style="margin:0;color:#7b8497;font-size:13px;line-height:1.6">
                  O código é de uso único. Se você não solicitou este cadastro, ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
